version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      root-minor:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor:
        patterns: ['*']
        update-types: ['minor', 'patch']